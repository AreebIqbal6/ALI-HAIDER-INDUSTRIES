# ==============================================================================
# WeaveSync SCADA - Eclipse Mosquitto Broker Configuration
# Client: Ali Haider Industries (SITE Industrial Area, Karachi)
# Target Environment: Industrial Edge Gateway (Ubuntu 24.04 LTS)
# Broker Image: eclipse-mosquitto:2
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Persistence & Data Storage
# ------------------------------------------------------------------------------
# Save in-flight QoS 1/2 messages and client subscriptions to disk
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800
autosave_on_changes false

# ------------------------------------------------------------------------------
# 2. Logging & Diagnostics
# ------------------------------------------------------------------------------
# Dual logging to container stdout (for `docker compose logs`) and persistent file
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

# Log severity levels
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------------------------
# 3. Pilot Listener: Unencrypted Port 1883 (PoE-Lite Bench & Pilot Test)
# ------------------------------------------------------------------------------
# Active for next week's localized factory floor proof-of-concept
# Allows the WT32-ETH01 pilot node (PIC-427708) to connect without TLS crypto overhead
listener 1883 0.0.0.0
allow_anonymous true
socket_domain ipv4

# ------------------------------------------------------------------------------
# 4. Production Listener: Encrypted Port 8883 with MQTTS / TLS (Phase 2 Full Rollout)
# ------------------------------------------------------------------------------
# Uncomment and mount certificates in /mosquitto/config/certs/ for 36-loom production
# listener 8883 0.0.0.0
# allow_anonymous false
# password_file /mosquitto/config/passwd
# cafile /mosquitto/config/certs/ahi-ca.crt
# certfile /mosquitto/config/certs/broker.crt
# keyfile /mosquitto/config/certs/broker.key
# tls_version tlsv1.3
# require_certificate true
# use_identity_as_username true

# ------------------------------------------------------------------------------
# 5. Resource Limits & Buffer Sizing
# ------------------------------------------------------------------------------
# Maximum concurrent client connections (-1 = unlimited)
max_connections -1

# Maximum in-flight queued QoS 1/2 messages per client (buffer bursts during sheds)
max_queued_messages 50000
max_queued_bytes 0

# Limit maximum message payload to 256 KB (prevent malicious large payloads)
message_size_limit 262144

# Keepalive timeouts
keepalive_interval 60
