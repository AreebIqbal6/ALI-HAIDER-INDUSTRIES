; PlatformIO Project Configuration for WT32-ETH01 Loom Pilot Node
; Ali Haider Industries - WeaveSync SCADA (PoE-Lite Hardware Pilot)

[env:wt32-eth01]
platform = espressif32
board = esp32-evb
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
    -D ETH_POWER_PIN=16
    -D ETH_TYPE=ETH_PHY_LAN8720
    -D ETH_ADDR=1
    -D ETH_MDC_PIN=23
    -D ETH_MDIO_PIN=18
